name: Tujia
description: >-
  Tujia (途家) is a Chinese online marketplace for short-term rentals, vacation
  homes, and homestays, frequently described as "China's Airbnb." Founded in
  2011 and headquartered in Beijing, the company connects travelers with
  apartments, villas, and serviced homes across China and select international
  destinations through its website, mobile apps, and WeChat mini-program. Tujia
  runs a consumer-facing booking marketplace and property-management services
  rather than a public developer platform. It was surfaced as a portfolio
  company of Qiming Venture Partners and added to the API Evangelist network;
  the enrichment pipeline probed the domain and found no public API, developer
  portal, or open platform for the company.
